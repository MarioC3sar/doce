
  version: '3.8'

  services:
    postgres:
      image: postgres:16-alpine
      container_name: precificacao_db
      restart: always
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: secretpassword
        POSTGRES_DB: precificacao_db
      ports:
        - "5438:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data

  volumes:
    pgdata: