
  version: '3.8'

  services:
    postgres:
      image: postgres:16-alpine
      container_name: precificacao_db
      restart: always
      environment:
        POSTGRES_USER: ${PG_USER}
        POSTGRES_PASSWORD: ${PG_PASSWORD}
        POSTGRES_DB: ${PG_DB}
      ports:
        - "5438:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data

  volumes:
    pgdata: